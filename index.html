<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Lump Sum Tax Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: one thumb-friendly column. Green header band with tabs, white cards on mint,
   big tap targets, sticky Calculate bar, bright result card with a keep-vs-tax bar. */
:root {
  --bg: #F1FBF6; --surface: #FFFFFF; --ink: #0E2B22; --muted: #4B6860; --line: #CFE9DB;
  --brand: #0B8A5F; --brand-deep: #066B49; --brand-soft: #DFF6EA;
  --sun: #FFC83D; --sun-soft: #FFF3CC; --sun-ink: #6B4A00;
  --coral: #F25C3C; --coral-soft: #FFE8E1; --coral-ink: #A32A10;
  --sky-soft: #DFF0FF; --sky-ink: #0F5CA8; --lilac-soft: #ECE6FF; --lilac-ink: #4F35C4;
  --wa: #25D366; --wa-ink: #05301D;
  --field: #F7FDFA; --ring: rgba(25,195,125,.28); --hdr1: #12AD76; --hdr2: #066B49;
  --f: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.5 var(--f); margin: 0; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 800; line-height: 1.15; text-wrap: balance; }
a { color: var(--brand-deep); font-weight: 700; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.mast { background: radial-gradient(circle at 92% -10%, rgba(255,255,255,.30), rgba(255,255,255,0) 45%), radial-gradient(circle at 6% 125%, rgba(255,200,61,.42), rgba(255,200,61,0) 42%), linear-gradient(135deg, var(--hdr1), var(--hdr2)); color: #fff; }
.mast .wrap { padding-block: 14px 14px; display: grid; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
.brand b { font-size: 17px; font-weight: 800; display: block; line-height: 1.1; }
.brand small { font-size: 12.5px; opacity: .9; font-weight: 600; }
nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
nav a { color: #fff; text-decoration: none; text-align: center; font-weight: 700; font-size: 13px; padding: 10px 2px; border-radius: 999px; background: rgba(255,255,255,.16); min-height: 44px; display: grid; place-items: center; }
nav a[aria-current="page"] { background: #fff; color: var(--brand-deep); }

main { display: grid; gap: 16px; padding-block: 20px 28px; }
.hero { display: grid; gap: 8px; }
.hero h1 { font-size: clamp(26px, 7.4vw, 34px); }
.hero p { color: var(--muted); font-size: 16px; }

.card { background: var(--surface); border-radius: 20px; padding: 18px; display: grid; gap: 14px; box-shadow: 0 2px 0 var(--line), 0 10px 24px -14px rgba(11,138,95,.35); min-width: 0; }
.card h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; font-size: 15px; font-weight: 800; flex: none; }

/* kind picker */
.kinds { display: grid; gap: 10px; }
.kind { position: relative; display: grid; grid-template-columns: 46px 1fr 24px; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: #fff; cursor: pointer; min-height: 68px; }
.kind input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.kind .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.kind .ic svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.g { background: var(--brand-soft); color: var(--brand-deep); } .ic.y { background: var(--sun-soft); color: var(--sun-ink); }
.ic.r { background: var(--coral-soft); color: var(--coral-ink); } .ic.b { background: var(--sky-soft); color: var(--sky-ink); } .ic.p { background: var(--lilac-soft); color: var(--lilac-ink); }
.kind b { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; }
.kind span.d { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.3; margin-top: 2px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: 14px; font-weight: 800; }
.kind.on { border-color: var(--brand); background: var(--brand-soft); }
.kind.on .tick { background: var(--brand); border-color: var(--brand); color: #fff; }
.kind:focus-within, .seg label:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }

/* fields */
.f { display: grid; gap: 6px; font-weight: 700; font-size: 15px; min-width: 0; }
.f small { font-weight: 500; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
input[type=text], input[type=date], input[type=number] { font: 700 19px var(--f); color: var(--ink); background: var(--field); border: 2px solid var(--line); border-radius: 14px; padding: 0 14px; height: 58px; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; text-align: left; }
input:focus { outline: none; border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px var(--ring); }
.money { position: relative; }
.money i { position: absolute; left: 14px; top: 0; height: 58px; display: grid; place-items: center; font-style: normal; font-weight: 800; color: var(--brand-deep); font-size: 19px; }
.money input { padding-left: 34px; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg label { position: relative; border: 2px solid var(--line); border-radius: 14px; text-align: center; padding: 10px 6px; font-weight: 700; font-size: 14.5px; min-height: 52px; display: grid; place-items: center; line-height: 1.2; cursor: pointer; background: #fff; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label.on { background: var(--brand); border-color: var(--brand); color: #fff; }
details { border-radius: 14px; background: var(--field); border: 2px solid var(--line); padding: 0 14px; }
details summary { cursor: pointer; font-weight: 700; color: var(--brand-deep); min-height: 52px; display: flex; align-items: center; }
details[open] { padding-bottom: 14px; display: grid; gap: 12px; }
details[open] summary { padding: 0; }
.hist { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: var(--field); border: 2px dashed var(--line); }
select { font: 700 16px var(--f); color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 14px; height: 52px; padding: 0 12px; width: 100%; min-width: 0; }

/* buttons */
button, .btn { font: 800 17px var(--f); border-radius: 16px; border: 2px solid transparent; min-height: 58px; padding: 0 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; width: 100%; }
.primary { background: var(--brand); color: #fff; box-shadow: 0 6px 0 var(--brand-deep); }
.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--brand-deep); }
.wa { background: var(--wa); color: var(--wa-ink); box-shadow: 0 6px 0 #17a14c; }
.wa:active { transform: translateY(3px); box-shadow: 0 3px 0 #17a14c; }
.ghost { background: #fff; color: var(--brand-deep); border-color: var(--line); }
.mini { min-height: 44px; width: auto; font-size: 14.5px; padding: 0 14px; border-radius: 12px; background: #fff; color: var(--coral-ink); border: 2px solid var(--coral-soft); }
.addrow { background: #fff; color: var(--brand-deep); border: 2px dashed var(--brand); min-height: 52px; font-size: 15.5px; }
button:focus-visible, .btn:focus-visible, nav a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.cta { position: sticky; bottom: 0; z-index: 5; padding-block: 18px 6px; background: linear-gradient(to top, var(--bg) 62%, transparent); display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--muted); min-height: 44px; font-size: 14.5px; font-weight: 700; text-decoration: underline; width: auto; justify-self: center; padding: 0 12px; }

/* notes */
.note { border-radius: 16px; padding: 14px 16px; font-size: 15px; line-height: 1.45; }
.note.warn { background: var(--sun-soft); color: var(--sun-ink); } .note.bad { background: var(--coral-soft); color: var(--coral-ink); }
.note.ok { background: var(--brand-soft); color: var(--brand-deep); } .note.info { background: var(--sky-soft); color: var(--sky-ink); }
.note ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.err { background: var(--coral-soft); color: var(--coral-ink); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 14.5px; display: grid; gap: 4px; }

/* result */
.result { background: radial-gradient(circle at 100% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 50%), linear-gradient(150deg, var(--hdr1) 0%, var(--hdr2) 100%); color: #fff; border-radius: 24px; padding: 22px 18px 18px; display: grid; gap: 14px; box-shadow: 0 12px 28px -12px rgba(6,107,73,.7); }
.result .k { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; font-weight: 800; opacity: .92; }
.result .big { font-size: clamp(38px, 12vw, 54px); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 16px; border-radius: 99px; background: #fff; overflow: hidden; display: flex; }
.bar b { display: block; background: var(--coral); height: 100%; margin-left: auto; min-width: 6px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.legend div { background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.legend small { font-size: 12.5px; font-weight: 700; opacity: .95; display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: #fff; display: inline-block; flex: none; }
.legend i.t { background: var(--coral); }
.legend strong { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 99px; }
.pill.ok { background: var(--brand-soft); color: var(--brand-deep); } .pill.warn { background: var(--sun-soft); color: var(--sun-ink); }
.stmt .line { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.stmt .line small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.stmt .line.good { color: var(--brand-deep); }
.stmt .total { background: var(--brand-soft); border-radius: 14px; padding: 14px; margin-top: 10px; border: 0; font-weight: 800; }
.amt { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-weight: 800; }
.fine { font-size: 13.5px; color: var(--muted); }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
ol.steps li::marker { color: var(--brand); font-weight: 800; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.scroll { overflow-x: auto; }
footer { color: var(--muted); font-size: 13px; padding-block: 4px 40px; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 8px; }

.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pal { width: 44px; min-height: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.24); border: 0; color: #fff; display: grid; place-items: center; padding: 0; box-shadow: none; flex: none; }
.pal svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 44px; min-height: 44px; height: 44px; padding: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); box-shadow: none; }
.swatches button[aria-pressed=true] { border-color: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.28); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 2px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; background: #fff; }
.opt.best { border-color: var(--brand); background: var(--brand-soft); }
.opt h3 { font-size: 17px; }
.opt .k { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.opt .v { font-size: clamp(19px, 5.4vw, 24px); font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.1; }
.opt .v.tax { color: var(--coral-ink); font-size: 18px; }
.opt .pc { font-size: 13px; color: var(--muted); font-weight: 600; }
.badge { justify-self: start; background: var(--brand); color: #fff; font-size: 11.5px; font-weight: 800; border-radius: 99px; padding: 3px 10px; }
.badge.off { background: var(--coral-soft); color: var(--coral-ink); }
.alert { border-radius: 22px; padding: 18px; display: grid; gap: 8px; color: #fff; font-size: 15px; line-height: 1.45; }
.alert.bad { background: #C93A1C; box-shadow: 0 10px 24px -12px rgba(201,58,28,.8); }
.alert.ok { background: var(--brand); }
.alert b { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.alert .big2 { font-size: clamp(30px, 9vw, 40px); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.alert ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.mwrap { display: grid; gap: 8px; }
.mhead { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.mhead span { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.meterbox { position: relative; padding-block: 4px; }
.meter { height: 18px; border-radius: 99px; background: var(--line); display: flex; overflow: hidden; }
.meter i { display: block; height: 100%; }
.lim { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.keys i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
@media (prefers-reduced-motion: no-preference) { .card, .result { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: .5; } } }
</style>

<header class="mast"><div class="wrap">
  <div class="brandrow">
    <div class="brand"><div class="logo">R</div><div><b id="brandName"></b><small id="brandTag"></small></div></div>
    <button class="pal" id="palBtn" type="button" aria-label="Change colours" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7l5.7 5.7a8 8 0 1 1-11.4 0z"/></svg></button>
  </div>
  <div class="swatches" id="swatches" hidden></div>

  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script id="engine">
/* ===== TAX ENGINE ===== */
const TAX_RULES = {
  "2026/27": {
    version: "2026.27-r4",
    start: "2026-03-01", end: "2027-02-28",
    verified: "2026-11-01",
    sources: [
      {t:"SARS: Retirement lump sum benefits", u:"https://www.sars.gov.za/tax-rates/income-tax/retirement-lump-sum-benefits/"},
      {t:"SARS: Guide on Calculation of Tax Payable on Lump Sum Benefits", u:"https://www.sars.gov.za/wp-content/uploads/Ops/Guides/LAPD-IT-G03-Guide-on-the-calculation-of-the-tax-payable-on-lump-sum-benefits.pdf"},
      {t:"SARS: Rates of Tax for Individuals", u:"https://www.sars.gov.za/tax-rates/income-tax/rates-of-tax-for-individuals/"},
      {t:"SARS: Tax Free Investments", u:"https://www.sars.gov.za/types-of-tax/personal-income-tax/tax-free-investments/"},
      {t:"National Treasury: Budget 2026 Tax Guide", u:"https://archive.treasury.gov.za/documents/national%20budget/2026/sars/Budget%202026%20Tax%20guide.pdf"}
    ],
    tables: {
      withdrawal: { name:"Withdrawal benefits", brackets:[
        {from:0, base:0, rate:0},
        {from:2750000, base:0, rate:18},
        {from:72600000, base:12573000, rate:27},
        {from:108900000, base:22374000, rate:36}
      ]},
      retirement: { name:"Retirement, death and severance benefits", brackets:[
        {from:0, base:0, rate:0},
        {from:55000000, base:0, rate:18},
        {from:77000000, base:3960000, rate:27},
        {from:115500000, base:14355000, rate:36}
      ]},
      individual: { name:"Individual income tax (Two-Pot)", brackets:[
        {from:0, base:0, rate:18},
        {from:24510000, base:4411800, rate:26},
        {from:38310000, base:7999800, rate:31},
        {from:53020000, base:12559900, rate:36},
        {from:69580000, base:18521500, rate:39},
        {from:88700000, base:25978300, rate:41},
        {from:187860000, base:66633900, rate:45}
      ]},
      rebates: { primary: 1782000, secondary: 976500, tertiary: 324900 }
    }
  }
};
const CUTOFF = { withdrawal:"2009-03-01", retirement:"2007-10-01", severance:"2011-03-01" };
const MAX_CENTS = 100000000000;
/* Tax-free savings account (TFSA): R46 000 a year from 1 March 2026, R500 000 lifetime, 40% on the excess */
const TFSA = { annual:4600000, lifetime:50000000, penalty:40 };

function bracketFor(cents, table){
  let b = table.brackets[0];
  for(const x of table.brackets){ if(cents >= x.from) b = x; }
  return b;
}
function taxOn(cents, table){
  if(!Number.isInteger(cents) || cents < 0) throw new Error("Invalid amount");
  const b = bracketFor(cents, table);
  return b.base + Math.round(((cents - b.from) * b.rate) / 100);
}
function calcIndividualTax(taxableIncomeCents, age, rules) {
  const tax = taxOn(taxableIncomeCents, rules.tables.individual);
  let rebate = rules.tables.rebates.primary;
  if(age >= 65) rebate += rules.tables.rebates.secondary;
  if(age >= 75) rebate += rules.tables.rebates.tertiary;
  return Math.max(0, tax - rebate);
}
/* Accepts "450000", "450 000", "R450 000.50", "450,000", "1,500,000", "450,50". Returns cents or NaN. */
function toCents(v){
  if(typeof v === "number") return Math.round(v*100);
  let s = String(v).replace(/[R\s ]/g,"");
  if(s==="") return NaN;
  if(/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(s)) s = s.replace(/,/g,"");
  else s = s.replace(",",".");
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}
function taxYearFor(date){
  for(const k of Object.keys(TAX_RULES)){ const r=TAX_RULES[k]; if(date>=r.start && date<=r.end) return k; }
  return null;
}
function catLabel(c){ return c==="withdrawal"?"withdrawal benefit":c==="retirement"?"retirement lump sum":"severance benefit"; }
function rand(cents){
  const neg = cents<0; const a=Math.abs(cents);
  const r = Math.floor(a/100), c = a%100;
  const s = String(r).replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (neg?"-":"")+"R"+s+"."+String(c).padStart(2,"0");
}
function randR(cents){ return rand(Math.round(cents/100)*100).replace(/\.00$/,""); }

function calculate(input){
  const errors=[], warnings=[], assumptions=[], steps=[];
  if(!["withdrawal","retirement","severance","pre1998_public"].includes(input.kind)) errors.push("Choose a valid calculation type.");
  if(!Number.isInteger(input.amount) || input.amount<0) errors.push("Enter the lump sum as a rand amount, for example 450 000.");
  else if(input.amount>MAX_CENTS) errors.push("That amount is above R1 000 000 000. Check the number of zeros.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(input.accrual||"")) errors.push("Enter the date the benefit is paid.");
  if(input.nonTaxableContrib!==undefined && !Number.isInteger(input.nonTaxableContrib)) errors.push("Check the non-taxable contributions amount.");

  const prev=[];
  (input.previous||[]).forEach((p,i)=>{
    const n=i+1;
    if(p.amount===null || p.amount===undefined || !Number.isInteger(p.amount)){ errors.push("Earlier lump sum "+n+": enter a valid amount."); return; }
    if(p.amount<0 || p.amount>MAX_CENTS){ errors.push("Earlier lump sum "+n+": amount out of range."); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p.date||"")){ errors.push("Earlier lump sum "+n+": enter the date it was paid."); return; }
    prev.push(p);
  });

  let taxableAmount = input.amount, taxFreeAmount = 0, exemptAmount = 0;
  if(input.kind === "pre1998_public"){
    if(!(input.totalYears > 0)) errors.push("Enter your total years of service.");
    else if(!(input.post1998Years >= 0)) errors.push("Enter your years of service after 1 March 1998 (0 if none).");
    else if(input.post1998Years > input.totalYears) errors.push("Years after 1998 cannot be more than total years.");
  }
  if(errors.length) return {ok:false, errors};

  const yearKey = taxYearFor(input.accrual);
  if(!yearKey) return {ok:false, errors:["The payment date must fall in the 2026/27 tax year (1 March 2026 to 28 February 2027). This simulator cannot give a valid estimate for other dates."]};
  const rules = TAX_RULES[yearKey];

  if(input.kind === "pre1998_public"){
    const ratio = input.post1998Years / input.totalYears;
    taxableAmount = Math.round(input.amount * ratio);
    taxFreeAmount = input.amount - taxableAmount;
    assumptions.push(`Pre-1998 public sector formula: ${input.post1998Years} ÷ ${input.totalYears} years = ${(ratio*100).toFixed(1)}% of the benefit is taxable.`);
  }
  const nonTaxableContrib = input.nonTaxableContrib || 0;
  if(nonTaxableContrib > 0){
    taxableAmount = Math.max(0, taxableAmount - nonTaxableContrib);
    exemptAmount += nonTaxableContrib;
    assumptions.push(`Non-taxable contributions of ${rand(nonTaxableContrib)} were taken off the taxable amount.`);
  }

  const table = rules.tables[input.kind === "withdrawal" ? "withdrawal" : "retirement"];

  let counted=0; const ignored=[], used=[];
  prev.forEach(p=>{
    if(p.date > input.accrual){ ignored.push({p, why:"is dated after the current benefit"}); return; }
    if(p.date < CUTOFF[p.cat]){ ignored.push({p, why:`is dated before ${CUTOFF[p.cat]}, the cutoff for ${p.cat} benefits`}); return; }
    counted += p.amount; used.push(p);
  });
  ignored.forEach(x=>warnings.push(`Earlier ${catLabel(x.p.cat)} of ${rand(x.p.amount)} dated ${x.p.date} was left out because it ${x.why}.`));

  const cumulative = counted + taxableAmount;
  const taxCum = taxOn(cumulative, table);
  const taxPrev = taxOn(counted, table);
  const taxCurrent = Math.max(0, taxCum - taxPrev);
  const net = input.amount - taxCurrent;
  const effective = input.amount>0 ? (taxCurrent/input.amount)*100 : 0;

  steps.push(`Gross benefit: ${rand(input.amount)}.`);
  if(taxFreeAmount > 0) steps.push(`Pre-1998 public sector tax-free portion: ${rand(taxFreeAmount)}.`);
  if(nonTaxableContrib > 0) steps.push(`Less non-taxable contributions: ${rand(nonTaxableContrib)}.`);
  steps.push(`Taxable amount for this benefit: ${rand(taxableAmount)}.`);
  steps.push(`Add earlier qualifying benefits: ${rand(counted)}. Running total: ${rand(cumulative)}.`);
  steps.push(`Tax on the running total (${table.name} table): ${rand(taxCum)}.`);
  steps.push(`Tax on earlier benefits alone: ${rand(taxPrev)}.`);
  steps.push(`Tax on this benefit: ${rand(taxCum)} - ${rand(taxPrev)} = ${rand(taxCurrent)}.`);
  steps.push(`Net amount: ${rand(input.amount)} - ${rand(taxCurrent)} = ${rand(net)}.`);

  let complete = true;
  if(input.history==="unsure"){ complete=false; warnings.push("You are not sure about earlier lump sums. They use up the cheaper tax bands, so your real tax can be higher. Ask your fund or SARS for your lump sum history."); }
  if(input.history==="some" && prev.length===0){ complete=false; warnings.push("You said you have earlier lump sums but listed none."); }
  if(input.history==="none") assumptions.push("No earlier withdrawal, retirement or severance lump sums since the SARS start dates (Retirement: 1 Oct 2007, Withdrawal: 1 Mar 2009, Severance: 1 Mar 2011).");

  return { ok:true, input, kind:input.kind, tableName:table.name, taxYear:yearKey, tableVersion:rules.version, verified:rules.verified, sources:rules.sources,
    amount:input.amount, taxFreeAmount, exemptAmount, taxableAmount, counted, cumulative, taxCum, taxPrev, taxCurrent, net, effective,
    complete, usedPrev:used, steps, assumptions, warnings, bracket:table.brackets };
}

function calculateTwoPot(input){
  const errors=[], warnings=[], assumptions=[], steps=[];
  if(!Number.isInteger(input.income) || input.income<0) errors.push("Enter your yearly taxable income, for example 300 000.");
  if(!Number.isInteger(input.amount) || input.amount<=0) errors.push("Enter the Two-Pot withdrawal amount.");
  else if(input.amount>MAX_CENTS) errors.push("That amount is above R1 000 000 000. Check the number of zeros.");
  if(input.withheld!==undefined && !Number.isInteger(input.withheld)) errors.push("Check the tax already withheld amount.");
  if(errors.length) return {ok:false, errors};

  const yearKey = taxYearFor(input.accrual);
  if(!yearKey) return {ok:false, errors:["Today's date is outside the supported 2026/27 tax year (1 March 2026 to 28 February 2027)."]};
  const rules = TAX_RULES[yearKey];
  const income = input.income, withdrawal = input.amount, totalIncome = income + withdrawal;

  const taxBefore = calcIndividualTax(income, input.age, rules);
  const taxAfter = calcIndividualTax(totalIncome, input.age, rules);
  const incrementalTax = Math.max(0, taxAfter - taxBefore);
  const net = withdrawal - incrementalTax;
  const effective = (incrementalTax/withdrawal)*100;

  steps.push(`Yearly taxable income before the withdrawal: ${rand(income)}.`);
  steps.push(`Estimated yearly tax before: ${rand(taxBefore)}.`);
  steps.push(`Taxable income including the withdrawal: ${rand(totalIncome)}.`);
  steps.push(`Estimated yearly tax after: ${rand(taxAfter)}.`);
  steps.push(`Extra tax caused by the withdrawal: ${rand(taxAfter)} - ${rand(taxBefore)} = ${rand(incrementalTax)}.`);
  steps.push(`Net withdrawal: ${rand(withdrawal)} - ${rand(incrementalTax)} = ${rand(net)}.`);

  assumptions.push("Two-Pot savings withdrawals are taxed at your normal income tax rates, not at lump sum rates.");
  assumptions.push(`Age ${input.age>=75?"75+":input.age>=65?"65 to 74":"under 65"} rebates applied: primary ${rand(rules.tables.rebates.primary)}${input.age>=65 ? ' + secondary ' + rand(rules.tables.rebates.secondary) : ''}${input.age>=75 ? ' + tertiary ' + rand(rules.tables.rebates.tertiary) : ''}.`);
  assumptions.push("This estimates your final yearly tax. The fund withholds tax at the time of payment and SARS settles the difference when you file your return.");
  if(withdrawal < 200000) warnings.push("Funds usually set a minimum Two-Pot withdrawal of R2 000. Check the minimum with your fund.");

  if(input.withheld && input.withheld > 0){
    const diff = incrementalTax - input.withheld;
    if(diff > 0) warnings.push(`The fund withheld ${rand(input.withheld)} but your estimated tax is ${rand(incrementalTax)}. You may owe SARS about ${rand(diff)} when you file.`);
    else if(diff < 0) warnings.push(`The fund withheld ${rand(input.withheld)} but your estimated tax is ${rand(incrementalTax)}. You may get about ${rand(Math.abs(diff))} back when you file.`);
    else assumptions.push("The amount withheld matches the estimated extra tax.");
  }
  return { ok:true, kind:"twopot", taxYear:yearKey, tableVersion:rules.version, verified:rules.verified, income, withdrawal, totalIncome, taxBefore, taxAfter, incrementalTax, net, effective, complete:true, steps, assumptions, warnings, bracket:rules.tables.individual.brackets, tableName:rules.tables.individual.name };
}
function calculateTfsa(i){
  const errors=[];
  if(!Number.isInteger(i.amount)||i.amount<=0) errors.push("Enter the amount you want to pay into the tax-free savings account.");
  else if(i.amount>MAX_CENTS) errors.push("That amount is above R1\u00A0000\u00A0000\u00A0000. Check the number of zeros.");
  if(!Number.isInteger(i.thisYear)||i.thisYear<0) errors.push("Check the amount already paid in this tax year.");
  if(!Number.isInteger(i.lifetime)||i.lifetime<0) errors.push("Check the total already paid in over all years.");
  if(errors.length) return {ok:false,errors};
  if(i.thisYear>i.lifetime) return {ok:false,errors:["The total over all years includes this tax year, so it cannot be smaller than this year's payments."]};
  const annualRoom=Math.max(0,TFSA.annual-i.thisYear), lifeRoom=Math.max(0,TFSA.lifetime-i.lifetime);
  const room=Math.min(annualRoom,lifeRoom);
  const excess=Math.max(0,i.amount-room), allowed=i.amount-excess;
  const penalty=Math.round(excess*TFSA.penalty/100);
  const overAnnual=Math.max(0,i.amount-annualRoom), overLife=Math.max(0,i.amount-lifeRoom);
  return { ok:true, amount:i.amount, thisYear:i.thisYear, lifetime:i.lifetime, annualRoom, lifeRoom, room, excess, allowed, penalty,
    breach:excess>0, breachAnnual:overAnnual>0, breachLife:overLife>0, overAnnual, overLife,
    alreadyOver:i.thisYear>TFSA.annual||i.lifetime>TFSA.lifetime, afterThisYear:i.thisYear+i.amount, afterLife:i.lifetime+i.amount };
}
/* ===== end engine ===== */
</script>

  res = calculate({kind:"pre1998_public", amount:c(1000000), accrual:"2026-11-01", totalYears:0, post1998Years:0, previous:[], history:"none"});

  res = calculateTwoPot({income:c(240000), amount:c(100000), age:40, accrual:"2026-11-01"});

  res = calculate({kind:"withdrawal", amount:c(450000), accrual:"2026-11-01", previous:[], history:"none"});
  eq("Resign R450,000 taxed, retire R450,000 not", [res.taxCurrent, calculate({kind:"retirement", amount:c(450000), accrual:"2026-11-01", previous:[], history:"none"}).taxCurrent].join("/"), c(76050)+"/0", "R550,000 tax-free retirement band");
  return T;
}

function submit(){
  const errs=[];
  if(!S.kind) errs.push("Choose what is happening in step 1.");
  if(S.kind && S.kind!=="twopot" && !S.history) errs.push("Tell us about earlier lump sums in step 3.");
  const show = ()=>{ $("#formErr").innerHTML='<div class="err" role="alert">'+errs.map(e=>"<span>"+esc(e)+"</span>").join("")+'</div>'; $("#formErr").scrollIntoView({behavior:"smooth",block:"center"}); };
  if(errs.length){ if(!$("#formErr")){ window.scrollTo(0,0); return; } show(); return; }
  try{
    let res;
    if(S.kind==="twopot"){
      res = calculateTwoPot({income:toCents(S.incomeText), amount:toCents(S.amountText), age:S.age, withheld:optCents(S.withheldText), accrual:today()});
    } else {
      const amount=toCents(S.amountText);
      const prev=(S.history==="none")?[]:S.rows.filter(r=>r.amount!==""||r.date!=="").map(r=>({cat:r.cat,amount:toCents(r.amount),date:r.date}));
      if(S.kind==="pre1998_public" && String(S.post1998Years).trim()==="") errs.push("Enter your years of service after 1 March 1998 (0 if none).");
      if(errs.length){ show(); return; }
      res = calculate({kind:S.kind, amount, accrual:S.accrual, previous:prev, history:S.history, nonTaxableContrib:optCents(S.nonTaxableText), totalYears:parseFloat(S.totalYears)||0, post1998Years:parseFloat(S.post1998Years)});
    }
    if(!res.ok){ errs.push(...res.errors); show(); return; }
    S.result=res; viewResult(); window.scrollTo(0,0);
  }catch(e){ errs.push("Something went wrong with those numbers. Please check them and try again."); show(); }
}

function summaryText(r){
  const L=[];
  L.push("*Lump sum tax estimate* ("+r.taxYear+")");

    L.push("Withdrawal: "+randR(r.withdrawal));

const fmtInt = c => String(Math.floor(c/100)).replace(/\B(?=(\d{3})+(?!\d))/g," ");

function compareScenarios(r){
  if(!["withdrawal","retirement","severance"].includes(r.kind)) return null;

let pdfLibPromise=null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);
  if(pdfLibPromise) return pdfLibPromise;
  pdfLibPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";
    s.onload=()=>res(window.PDFLib); s.onerror=()=>{ pdfLibPromise=null; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return pdfLibPromise;
}
/* Small drawing helper on top of pdf-lib. Positions are in mm from the top-left of an A4 page. */
async function makePdfDoc(P){
  const pdf=await P.PDFDocument.create();
  const fonts={normal:await pdf.embedFont(P.StandardFonts.Helvetica), bold:await pdf.embedFont(P.StandardFonts.HelveticaBold)};
  const MM=72/25.4, H=297;
  const pages=[pdf.addPage([595.28,841.89])]; let cur=0;
  const st={fill:[0,0,0],draw:[0,0,0],text:[0,0,0],font:"normal",size:10};
  const col=a=>P.rgb(a[0]/255,a[1]/255,a[2]/255);
  const clean=t=>String(t).replace(/[\u00A0\u202F]/g," ").replace(/[^\x20-\x7E\u00A1-\u00FF]/g,"?");
  const wpt=t=>fonts[st.font].widthOfTextAtSize(clean(t),st.size);
  return {
    setFillColor:(r,g,b)=>{ st.fill=[r,g,b]; }, setDrawColor:(r,g,b)=>{ st.draw=[r,g,b]; }, setTextColor:(r,g,b)=>{ st.text=[r,g,b]; },
    setFont:(_n,style)=>{ st.font=style==="bold"?"bold":"normal"; }, setFontSize:n=>{ st.size=n; },
    rect:(x,y,w,h)=>pages[cur].drawRectangle({x:x*MM,y:(H-y-h)*MM,width:w*MM,height:h*MM,color:col(st.fill)}),
    roundedRect:(x,y,w,h)=>pages[cur].drawRectangle({x:x*MM,y:(H-y-h)*MM,width:w*MM,height:h*MM,color:col(st.fill)}),
    line:(x1,y1,x2,y2)=>pages[cur].drawLine({start:{x:x1*MM,y:(H-y1)*MM},end:{x:x2*MM,y:(H-y2)*MM},thickness:.6,color:col(st.draw)}),
    text:(t,x,y,o)=>{ const c=clean(t); const w=wpt(c); const xp=x*MM-((o&&o.align==="right")?w:0); pages[cur].drawText(c,{x:xp,y:(H-y)*MM,size:st.size,font:fonts[st.font],color:col(st.text)}); },
    splitTextToSize:(t,maxMm)=>{ const out=[]; let line=""; clean(t).split(/\s+/).forEach(w=>{ const tryL=line?line+" "+w:w; if(wpt(tryL)>maxMm*MM && line){ out.push(line); line=w; } else line=tryL; }); if(line) out.push(line); return out; },
    addPage:()=>{ pages.push(pdf.addPage([595.28,841.89])); cur=pages.length-1; },
    setPage:i=>{ cur=i-1; }, getNumberOfPages:()=>pages.length, save:()=>pdf.save()
  };
}

async function makePdf(){
  const msg=$("#pdfMsg"), btn=$("#pdfBtn"); msg.textContent="Creating PDF..."; btn.disabled=true;
  try{
    const J=await loadPdfLib();
    const nm=(S.clientName||"").trim();
    const doc=await buildPdf(J,S.result,compareScenarios(S.result),nm,S.tfsaLast);
    const blob=new Blob([await doc.save()],{type:"application/pdf"});
    const fname=(nm?"Lump-sum-estimate-"+nm.replace(/[^A-Za-z0-9]+/g,"-"):"Lump-sum-estimate")+".pdf";
    const file=new File([blob],fname,{type:"application/pdf"});

      try{ await navigator.share({files:[file],title:BUSINESS.name,text:"Lump sum tax estimate"}); msg.textContent="PDF ready."; return; }

}

      <div class="line"><span>Income including withdrawal</span><span class="amt">${rand(r.totalIncome)}</span></div>
      <div class="line"><span>Yearly tax after</span><span class="amt">${rand(r.taxAfter)}</span></div>
      <div class="line"><span><b>Extra tax from withdrawal</b></span><span class="amt">${rand(r.incrementalTax)}</span></div>
      <div class="line total"><span>You receive<small>Tax is ${r.effective.toFixed(2)}% of the withdrawal</small></span><span class="amt">${rand(r.net)}</span></div>`;
  } else {
    breakdown = `
      <div class="line"><span>Gross benefit</span><span class="amt">${rand(r.amount)}</span></div>
      ${r.taxFreeAmount>0?`<div class="line good"><span>Pre-1998 tax-free part</span><span class="amt">${rand(r.taxFreeAmount)}</span></div>`:""}
      ${r.exemptAmount>0?`<div class="line good"><span>Non-taxable contributions</span><span class="amt">${rand(r.exemptAmount)}</span></div>`:""}
      <div class="line"><span>Taxable amount<small>Earlier benefits counted: ${rand(r.counted)}</small></span><span class="amt">${rand(r.taxableAmount)}</span></div>
      <div class="line"><span>Tax on running total<small>Running total ${rand(r.cumulative)}</small></span><span class="amt">${rand(r.taxCum)}</span></div>
      <div class="line"><span>Less tax on earlier benefits</span><span class="amt">${rand(r.taxPrev)}</span></div>
      <div class="line"><span><b>Tax on this benefit</b></span><span class="amt">${rand(r.taxCurrent)}</span></div>
      <div class="line total"><span>You receive<small>Tax is ${r.effective.toFixed(2)}% of the gross benefit</small></span><span class="amt">${rand(r.net)}</span></div>`;
  }
  const taxW = Math.max(0, Math.min(100, r.effective));
  const msg = summaryText(r);
  const waShare = "https://wa.me/?text="+encodeURIComponent(msg);
  const waChat = BUSINESS.whatsapp ? "https://wa.me/"+BUSINESS.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent("Hi, I used the "+BUSINESS.name+" and would like to talk it through.\n\n"+msg) : "";

  const cmp=compareScenarios(r);
  let cmpHTML="";
  if(cmp){
    const a=cmp.resign, b=cmp.retire, d=b.net-a.net;
    const card=(title,x,state)=>`<div class="opt ${state==="best"?"best":""}"><span class="badge ${state==="best"?"":"off"}">${state==="best"?"Keeps more":state==="same"?"Same tax":"Higher tax"}</span><h3>${title}</h3><div><div class="k">You receive</div><div class="v">${randR(x.net)}</div></div><div><div class="k">Tax</div><div class="v tax">${randR(x.taxCurrent)}</div></div><div class="pc">${x.effective.toFixed(1)}% of the amount</div></div>`;
    const sA = d===0?"same":(d<0?"best":"worse"), sB = d===0?"same":(d>0?"best":"worse");
    cmpHTML = `<section class="card"><h2>Resign or retire?</h2>
      <p class="fine">Same amount, date and earlier lump sums. Only the tax table changes.</p>
      <div class="cmp">${card("Resign",a,sA)}${card("Retire",b,sB)}</div>
      <div class="note ${d===0?"info":"ok"}"><b>${d===0?"Both routes give the same tax on this amount.":(d>0?"Retiring keeps "+randR(d)+" more than resigning.":"Resigning keeps "+randR(-d)+" more than retiring.")}</b></div>
      <div class="note info"><b>Preserve instead:</b> transfer to a preservation fund and pay <b>R0 tax today</b>. The full ${randR(r.amount)} stays invested and tax applies when you later take it as cash.</div>
      <p class="fine">Retiring in cash is only possible from your fund's retirement age (usually 55) and some funds limit the cash part. Retrenchment uses the same table as retirement.</p></section>`;
  }

  app.innerHTML = `
  <section class="hero"><h1>Your estimate</h1><p>${esc(kindTitle(r.kind))} · ${esc(r.taxYear)} tax year</p><div>${badge}</div></section>
  <section class="result" aria-label="Result">
    <div class="k">You would receive about</div>
    <div class="big">${randR(r.net)}</div>
    <div class="bar" role="img" aria-label="Tax is ${r.effective.toFixed(1)} percent of the amount"><b style="width:${taxW}%"></b></div>
    <div class="legend">
      <div><small><i></i>You keep</small><strong>${randR(r.net)}</strong></div>
      <div><small><i class="t"></i>Tax (${r.effective.toFixed(1)}%)</small><strong>${randR(tax)}</strong></div>
    </div>
  </section>

  <section class="card"><h2>Send to your client</h2>
    <label class="f" for="clientName">Client name for the PDF (optional)<input id="clientName" type="text" autocomplete="off" placeholder="e.g. Thandi Mokoena" value="${esc(S.clientName)}"></label>
    <button class="primary" id="pdfBtn" type="button">Create PDF</button>
    <div id="pdfMsg" class="fine" aria-live="polite"></div>
    <a class="btn wa" id="waShare" href="${waShare}" target="_blank" rel="noopener">${ico("chat").replace("<svg","<svg width='24' height='24' style='fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round'")}Share on WhatsApp</a>
    ${waChat?`<a class="btn ghost" href="${waChat}" target="_blank" rel="noopener">${esc(BUSINESS.chatLabel)}</a>`:""}
    <button class="ghost" id="copy" type="button">Copy summary</button>
    <div id="copied" aria-live="polite" class="fine"></div>
  </section>

  ${r.warnings.length?`<section class="note ${r.complete?"warn":"bad"}" role="note"><b>${r.complete?"Please read":"This may not be accurate"}</b><ul>${r.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></section>`:""}

  ${cmpHTML}

  <section class="card"><h2>Saving the money again?</h2>
    <p class="fine" style="font-size:15px">Test a tax-free savings account contribution against the ${randR(TFSA.annual)} yearly and ${randR(TFSA.lifetime)} lifetime limits. Anything over is penalised at ${TFSA.penalty}%.</p>
    <a class="btn ghost" id="toTfsa" href="#tfsa">Check tax-free savings limits</a></section>

  <section class="card"><h2>Breakdown</h2><div class="stmt">${breakdown}</div></section>

  <details><summary>Step by step</summary>
    <ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <p class="fine">Table used: ${esc(r.tableName)}. Only the part of the total inside each band is taxed at that band's rate.</p>
    <div class="scroll"><table><thead><tr><th>Above</th><th>Tax</th></tr></thead><tbody>
      ${r.bracket.map(b=>`<tr><td style="white-space:nowrap">${randR(b.from)}</td><td>${b.rate===0&&!b.base?"0%":(b.base?randR(b.base)+" plus ":"")+b.rate+"%"}</td></tr>`).join("")}
    </tbody></table></div>
  </details>
  <details><summary>Assumptions</summary>
    <ul class="plain">${r.assumptions.map(a=>`<li>${esc(a)}</li>`).join("")||"<li>None beyond the standard rules.</li>"}</ul>
    <p class="fine">Tax table version ${esc(r.tableVersion)}, checked ${esc(r.verified)}. Tax rules change every year.</p>
  </details>

  <div style="display:grid;gap:10px">
    <button class="primary" id="newCalc" type="button">New calculation</button>
    <button class="ghost" id="back" type="button">Change my answers</button>
  </div>
  <p class="note info">This is an estimate for illustration, not an official SARS directive. SARS sets the actual tax when your fund applies for a lump sum directive.</p>`;

  $("#clientName").addEventListener("input",e=>S.clientName=e.target.value);
  $("#pdfBtn").onclick=makePdf;
  $("#toTfsa").onclick=()=>{ S.tfsa.amount=fmtInt(r.net); };
  $("#newCalc").onclick=()=>{ blankState(); viewCalc(); window.scrollTo(0,0); };
  $("#back").onclick=()=>{ S.result=null; viewCalc(); window.scrollTo(0,0); };
  $("#copy").onclick=async()=>{
    const out=$("#copied");
    try{ await navigator.clipboard.writeText(msg.replace(/[*_]/g,"")); out.textContent="Summary copied."; setTimeout(()=>out.textContent="",3000); }
    catch(e){ out.innerHTML='<textarea readonly rows="7" style="width:100%;font:500 14px var(--f);border:2px solid var(--line);border-radius:12px;padding:10px">'+esc(msg.replace(/[*_]/g,""))+'</textarea>'; const ta=out.querySelector("textarea"); ta.focus(); ta.select(); }
  };
}

/* ===== TAX-FREE SAVINGS ===== */
function meter(label, limit, existing, add){
  const room=Math.max(0,limit-existing), within=Math.min(add,room), over=add-within;
  const scale=Math.max(limit, existing+add);
  const pct=v=>(v/scale*100).toFixed(2)+"%";
  return `<div class="mwrap"><div class="mhead"><b>${label}</b><span>${randR(existing+add)} of ${randR(limit)}</span></div>
    <div class="meterbox"><div class="meter"><i style="width:${pct(existing)};background:var(--brand)"></i><i style="width:${pct(within)};background:var(--sun)"></i><i style="width:${pct(over)};background:var(--coral)"></i></div><span class="lim" style="left:${pct(limit)}"></span></div></div>`;
}
function updateTfsa(){
  const out=$("#tfOut"); if(!out) return;
  const t=S.tfsa;
  if(t.amount.trim()===""){ S.tfsaLast=null; out.innerHTML='<div class="note info">Enter an amount to see if it fits inside the limits.</div>'; return; }
  const yr=optCents(t.thisYear);
  const res=calculateTfsa({amount:toCents(t.amount), thisYear:yr, lifetime:t.lifetime.trim()===""?yr:optCents(t.lifetime)});
  if(!res.ok){ S.tfsaLast=null; out.innerHTML='<div class="err" role="alert">'+res.errors.map(e=>"<span>"+esc(e)+"</span>").join("")+'</div>'; return; }
  S.tfsaLast=res;
  const why=[];
  if(res.breachAnnual) why.push("Over the yearly limit of "+randR(TFSA.annual)+" by "+randR(res.overAnnual)+".");
  if(res.breachLife) why.push("Over the lifetime limit of "+randR(TFSA.lifetime)+" by "+randR(res.overLife)+".");
  const head = res.breach
    ? `<div class="alert bad" role="alert"><b>Limit breached</b><div class="big2">${randR(res.penalty)} penalty</div>
        <p>${randR(res.excess)} of the ${randR(res.amount)} is over the limit. SARS charges ${TFSA.penalty}% on the excess, as normal tax on assessment.</p>
        <ul>${why.map(w=>`<li>${w}</li>`).join("")}</ul>
        <p><b>Safe amount to pay in: ${randR(res.allowed)}</b></p></div>`
    : `<div class="alert ok" role="status"><b>Within the limits</b><div class="big2">No penalty</div>
        <p>${randR(res.amount)} fits. Room left after this payment: ${randR(Math.max(0,TFSA.annual-res.afterThisYear))} this tax year and ${randR(Math.max(0,TFSA.lifetime-res.afterLife))} over your lifetime.</p></div>`;
  const notes=[];
  if(res.alreadyOver) notes.push("Your earlier payments already pass a limit, so every extra rand paid in counts as excess.");
  if(t.lifetime.trim()==="" && yr>0) notes.push("The lifetime total was left blank, so it is taken as equal to this year's payments.");
  out.innerHTML = head + `<section class="card"><h2>Where you stand</h2>
    ${meter("This tax year",TFSA.annual,res.thisYear,res.amount)}${meter("Lifetime",TFSA.lifetime,res.lifetime,res.amount)}
    <div class="keys"><span><i style="background:var(--brand)"></i>Already paid in</span><span><i style="background:var(--sun)"></i>This payment, within limit</span><span><i style="background:var(--coral)"></i>Over the limit</span></div>
    ${notes.map(n=>`<div class="note warn">${esc(n)}</div>`).join("")}</section>`;
}
function viewTfsa(){
  app.innerHTML=`
  <section class="hero"><h1>Tax-free savings check</h1><p>Test a contribution against the ${randR(TFSA.annual)} yearly and ${randR(TFSA.lifetime)} lifetime limits. Anything over is penalised at ${TFSA.penalty}%.</p></section>
  <section class="card"><h2>The contribution</h2>
    <label class="f" for="tf_amount">Amount to pay in${money("tf_amount","46 000",S.tfsa.amount)}</label>
    ${S.result?`<button type="button" class="ghost" id="useNet">Use my lump sum result (${randR(S.result.net)})</button>`:""}
    <label class="f" for="tf_year">Already paid in this tax year${money("tf_year","0",S.tfsa.thisYear)}<small>1 March 2026 to 28 February 2027, all providers added together.</small></label>
    <label class="f" for="tf_life">Already paid in over all years${money("tf_life","0",S.tfsa.lifetime)}<small>Include this tax year. Money you take out does not free up room.</small></label>
  </section>
  <div id="tfOut" style="display:grid;gap:16px"></div>
  <section class="note info"><b>The rules</b><ul>
    <li>Yearly limit ${randR(TFSA.annual)} per person from the 2026/27 tax year, lifetime limit ${randR(TFSA.lifetime)}.</li>
    <li>SARS charges ${TFSA.penalty}% on the part above either limit, as normal tax on assessment.</li>
    <li>Unused yearly room is lost at year end. Taking money out and paying it back in counts as a new contribution.</li></ul></section>`;
  const map={tf_amount:"amount",tf_year:"thisYear",tf_life:"lifetime"};
  Object.keys(map).forEach(id=>{ const el=$("#"+id); el.addEventListener("input",()=>{ fmtMoney(el); S.tfsa[map[id]]=el.value; updateTfsa(); }); });
  const u=$("#useNet"); if(u) u.onclick=()=>{ S.tfsa.amount=fmtInt(S.result.net); $("#tf_amount").value=S.tfsa.amount; updateTfsa(); };
  updateTfsa();
}

function viewMethod(){
  const tab=(t)=>`<div class="scroll"><table><thead><tr><th>Total</th><th>Tax</th></tr></thead><tbody>${t.brackets.map((b,i,a)=>`<tr><td style="white-space:nowrap">${i===0?"R0 to "+randR(a[1].from):"Above "+randR(b.from)}</td><td>${b.rate===0&&!b.base?"0%":(b.base?randR(b.base)+" plus ":"")+b.rate+"% of the part above "+randR(b.from)}</td></tr>`).join("")}</tbody></table></div>`;
  app.innerHTML=`
  <section class="hero"><h1>Method</h1><p>The steps, the tables and the checks.</p></section>
  <section class="card"><h2>Running total method</h2>
    <ol class="steps"><li>List earlier benefits that count. Retirement from 1 October 2007, withdrawal from 1 March 2009, severance from 1 March 2011.</li>
    <li>Add the new benefit and apply the right table to the total.</li>
    <li>Apply the same table to the earlier benefits alone.</li>
    <li>The difference is the tax on the new benefit.</li></ol>
    <p class="note warn">Earlier benefits of all three types are added together and taxed on the table for the current benefit. Confirm the treatment for each client before relying on a figure.</p>
  </section>
  <section class="card"><h2>Tax-free lump sum amounts</h2>
    <p>The first ${randR(YR.tables.retirement.brackets[1].from)} of retirement, death and severance benefits, and the first ${randR(YR.tables.withdrawal.brackets[1].from)} of withdrawal benefits, are taxed at 0%. These amounts are shared across all earlier lump sums, which is why earlier benefits matter.</p>
  </section>
  <section class="card"><h2>Tax-free savings accounts</h2>
    <p>Yearly limit ${randR(TFSA.annual)}, lifetime limit ${randR(TFSA.lifetime)}. Excess contributions are charged ${TFSA.penalty}% of the excess. Room is the smaller of the yearly room left and the lifetime room left.</p>
  </section>
  <section class="card"><h2>Tax tables 2026/27</h2><p class="fine">1 March 2026 to 28 February 2027. Version ${esc(YR.version)}, checked ${esc(YR.verified)}.</p>
    <h3 style="font-size:16px">Withdrawal benefits</h3>${tab(YR.tables.withdrawal)}
    <h3 style="font-size:16px">Retirement, death and severance</h3>${tab(YR.tables.retirement)}
    <h3 style="font-size:16px">Income tax (used for Two-Pot)</h3>${tab(YR.tables.individual)}
  </section>
  <section class="card"><h2>Built-in checks</h2><p>Runs the simulator against figures worked out by hand, including every band edge and every tax-free savings limit.</p>
    <button id="runT" class="primary" type="button">Run the checks</button><div id="tout"></div></section>`;
  $("#runT").onclick=()=>{
    const T=runSelfTests(), p=T.filter(t=>t.pass).length;
    $("#tout").innerHTML=`<p class="note ${p===T.length?"ok":"bad"}" style="margin:12px 0"><b>${p} of ${T.length} checks passed.</b></p><div class="scroll"><table><thead><tr><th>Check</th><th>Result</th></tr></thead><tbody>${T.map(t=>`<tr><td>${esc(t.name)}<br><span class="fine">${esc(t.src)}</span></td><td><b style="color:var(${t.pass?"--brand-deep":"--coral-ink"})">${t.pass?"Pass":"FAIL"}</b></td></tr>`).join("")}</tbody></table></div>`;
  };
}

function viewSources(){
  const c=v=>Math.round(v*100);
  const w=calculate({kind:"withdrawal",amount:c(100000),accrual:"2026-11-01",previous:[],history:"none"});
  const rt=calculate({kind:"retirement",amount:c(770000),accrual:"2026-11-01",previous:[],history:"none"});
  const pb=calculate({kind:"pre1998_public",amount:c(1000000),accrual:"2026-11-01",totalYears:30,post1998Years:20,previous:[],history:"none"});
  const tp=calculateTwoPot({income:c(300000),amount:c(100000),age:40,accrual:"2026-11-01"});
  const tf=calculateTfsa({amount:c(50000),thisYear:0,lifetime:0});
  const tl=calculateTfsa({amount:c(30000),thisYear:0,lifetime:c(480000)});
  app.innerHTML=`
  <section class="hero"><h1>Sources and limits</h1></section>
  <section class="card"><h2>Where the numbers come from</h2>
    <ul class="plain">${YR.sources.map(s=>`<li><a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a></li>`).join("")}</ul></section>
  <section class="card"><h2>Worked examples</h2>
    <ul class="plain" style="font-size:15px">
      <li><b>Resigning, R100 000, no history.</b> Tax (100 000 − 27 500) × 18% = ${rand(w.taxCurrent)}. You receive ${rand(w.net)}.</li>
      <li><b>Retiring, R770 000, no history.</b> Tax (770 000 − 550 000) × 18% = ${rand(rt.taxCurrent)}. You receive ${rand(rt.net)}.</li>
      <li><b>Public sector, R1 000 000, 30 years, 20 after 1998.</b> Taxable ${rand(pb.taxableAmount)}, tax-free ${rand(pb.taxFreeAmount)}. Tax ${rand(pb.taxCurrent)}. You receive ${rand(pb.net)}.</li>
      <li><b>Two-Pot R100 000, income R300 000, age 40.</b> Yearly tax goes from ${rand(tp.taxBefore)} to ${rand(tp.taxAfter)}. Extra tax ${rand(tp.incrementalTax)}. You receive ${rand(tp.net)}. The withdrawal pushes part of your income into the 31% band.</li>
      <li><b>Tax-free savings, R50 000 paid in one year.</b> ${randR(TFSA.annual)} fits. The excess of ${rand(tf.excess)} is penalised at 40%: ${rand(tf.penalty)}.</li>
      <li><b>Tax-free savings, R30 000 with R480 000 already paid in.</b> Only ${randR(tl.allowed)} of lifetime room is left. The excess of ${rand(tl.excess)} costs ${rand(tl.penalty)}.</li>
    </ul></section>
  <section class="card"><h2>Limits</h2>
    <ul class="plain">
      <li>Only the 2026/27 tax year is supported. Other dates are blocked so you never get a misleading figure.</li>
      <li>The pre-1998 public sector estimate uses the standard service ratio. Transfers or purchased service need a professional directive.</li>
      <li>Two-Pot figures estimate your final yearly tax. The fund's withholding may differ, so you may owe SARS or get a refund when you file.</li>
      <li>The resign or retire comparison assumes both routes are open to the client. Retirement age and fund rules decide what is allowed.</li>
      <li>This does not replace a SARS lump sum directive. Confirm cash limits and fund rules with the fund.</li>
      <li>Your figures are calculated on your phone and are not sent anywhere. Only the PDF tool is downloaded when you open a result.</li>
    </ul></section>`;
}
route();
</script>
